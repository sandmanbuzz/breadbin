# Standalone C64 test program: BASIC stub at $0801, code after it, results in $C000.
MEMORY {
    LA:   start = $07FF, size = 2,    file = %O;
    MAIN: start = $0801, size = $1800, file = %O;
    RAM:  start = $C000, size = $100, file = "";
}
SEGMENTS {
    LOADADDR: load = LA,   type = ro;
    STUB:     load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    BSS:      load = RAM,  type = bss;
}

# Breadbin kernel modules (docs/design/next/modules-v1.md): linked at %S ($0000 and $0100) and turned
# into CX files like programs, but with no zero page of their own (they use the kernel's by import)
# and a HEADER segment first: jmp init, jmp fini, kernel API hash, class byte.
MEMORY {
    M: start = %S, size = $2000, file = %O;
}
SEGMENTS {
    HEADER: load = M, type = ro;
    CODE:   load = M, type = ro;
    RODATA: load = M, type = ro, optional = yes;
    DATA:   load = M, type = rw, optional = yes;
    BSS:    load = M, type = bss, define = yes, optional = yes;
}

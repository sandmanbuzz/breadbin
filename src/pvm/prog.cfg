# Breadbin p-code programs (CX format 2, importing /lib/pvm; tools/pvmlink.py): linked at %S
# ($0000 and $0100). The VM uses zero page $23-$39 (pvm.s); the program has $3A-$3F. Do not link
# the user library's zero-page users (src/lib/lib.inc: lp3 at $34, lt3 and lval at $39-$3B):
# they overlap. The CODE segment starts the image: the program's entry point.
MEMORY {
    ZP: start = $3A, size = $06, type = rw;
    M:  start = %S,  size = $9000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    CODE:     load = M, type = ro;
    RODATA:   load = M, type = ro, optional = yes;
    DATA:     load = M, type = rw, optional = yes;
    BSS:      load = M, type = bss, define = yes, optional = yes;
}

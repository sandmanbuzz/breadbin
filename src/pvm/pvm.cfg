# Breadbin p-code programs: the VM (src/pvm/pvm.s, segment PVM) starts the image, its opcode table
# page-aligned. Linked at %S ($0000 and $0100) and made into a CX file like any program (prog.cfg).
# The VM uses zero page $23-$36 itself (pvm.s); the program has $39-$3F. Do not link the user
# library's zero-page users (src/lib/lib.inc: lp3 at $34, lt3 and lval at $39-$3B): they overlap.
MEMORY {
    ZP: start = $39, size = $07, type = rw;
    M:  start = %S,  size = $9000, file = %O;
}
SEGMENTS {
    PVM:      load = M, type = ro, align = $100;
    ZEROPAGE: load = ZP, type = zp, optional = yes;
    CODE:     load = M, type = ro, optional = yes;
    RODATA:   load = M, type = ro, optional = yes;
    DATA:     load = M, type = rw, optional = yes;
    BSS:      load = M, type = bss, define = yes, optional = yes;
}

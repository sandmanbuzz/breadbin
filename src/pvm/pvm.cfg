# The p-code VM as a shared library (CX format 3, /lib/pvm; tools/pvmlink.py): src/pvm/pvm.s,
# linked at %S ($0000 and $0100). The image is page-aligned, the opcode table at offset $100
# (JMP (OPTBL) puts the opcode in the low byte). No BSS: every byte of VM state is the process's.
MEMORY {
    M:  start = %S,  size = $1000, file = %O;
}
SEGMENTS {
    PVM:      load = M, type = ro, align = $100;
}

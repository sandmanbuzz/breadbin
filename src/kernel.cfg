# Breadbin kernel: loads at $0801 (BASIC SYS stub), copies itself up and runs
# from KRAM; the syscall jump table lives at a fixed $CF00. The KERNAL ROM is
# not used, so the RAM under it ($E000-$FFF9) holds the kernel's BSS (tables,
# block cache, process save areas) and leaves $8000-$CEFF for code. The hardware
# vectors at $FFFA-$FFFF are written by the boot stub.
MEMORY {
    ZP:   start = $40,   size = $50,   type = rw, define = yes;
    LA:   start = $07FF, size = 2,     file = %O;
    LOAD: start = $0801, size = $8000, file = %O;
    KRAM: start = $9800, size = $3700, define = yes;
    JT:   start = $CF00, size = $100;
    KHI:  start = $E000, size = $1FFA, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOADADDR: load = LA,   type = ro;
    STUB:     load = LOAD, type = ro;
    CODE:     load = LOAD, run = KRAM, type = ro, define = yes;
    RODATA:   load = LOAD, run = KRAM, type = ro, define = yes;
    DATA:     load = LOAD, run = KRAM, type = rw, define = yes;
    JUMPTAB:  load = LOAD, run = JT,   type = ro, define = yes;
    INIT:     load = LOAD, run = LOAD, type = ro, define = yes;
    BSS:      load = KHI,  type = bss, define = yes;
    # CODEHI is placed after the BSS in KHI (ld65 allocates in list order): code in the RAM
    # under the KERNAL ROM, out of the way of the user pool.
    CODEHI:   load = LOAD, run = KHI,  type = ro, define = yes;
}
